<!DOCTYPE html>
<html lang="pt-BR">

<head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Mundo Disney</title>


    <link rel="stylesheet" href="css/style.css">

    <link rel="manifest" href="manifest.json">

    <link rel="icon" type="image/png" href="icons/launchericon-192x192.png">

</head>

<body>


    <main class="container">


        <h1>MUNDO DISNEY</h1>


        <p class="subtitulo">
            Explore os personagens do universo Disney
        </p>


        <div class="area-busca">


            <input type="text" id="campoBusca" placeholder="Pesquisar personagem...">


            <button id="botaoBuscar">
                Buscar
            </button>

        </div>


        <p id="quantidade">
            Carregando personagens...
        </p>


        <section id="personagens" class="personagens">
        </section>


        <p id="carregando"></p>


        <button id="botaoCarregar">
            CARREGAR MAIS
        </button>


        <p id="paginaAtual">
            Página 1
        </p>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
